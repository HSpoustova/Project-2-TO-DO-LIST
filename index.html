<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TO DO LIST</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="board">
        <div class="board_header">
          <h2>My Tasks</h2>
        </div>
        <ul class="task_list" id="taskList"></ul>
        <div class="task_add">
          <input
            type="text"
            id="taskInput"
            placeholder="New Task..."
            maxlength="255"
          />
          <button id="button_add" type="submit">+</button>
        </div>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
